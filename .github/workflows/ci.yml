name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@14d1e594d5f246a795d0c0c11cf7d2d6c8e5617f # v1.6.1
    with:
      tooling_sha: 14d1e594d5f246a795d0c0c11cf7d2d6c8e5617f
      release_dry_run: ${{ inputs.release_dry_run || false }}

  specification:
    name: Specification governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: faustbrian/go-library-tools
          ref: 14d1e594d5f246a795d0c0c11cf7d2d6c8e5617f # v1.6.1
          path: .golib-tooling
          persist-credentials: false
      - uses: ./.golib-tooling/.github/actions/setup-golib
      - run: golib specification check --online

  required:
    name: Required
    if: always()
    needs: [ci, specification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow and specification governance
        env:
          CI_RESULT: ${{ needs.ci.result }}
          SPECIFICATION_RESULT: ${{ needs.specification.result }}
        run: test "${CI_RESULT}" = success && test "${SPECIFICATION_RESULT}" = success
