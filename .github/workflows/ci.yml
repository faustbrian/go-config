name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean
      security_diagnostic:
        description: Run development security qualification, not release CI
        required: false
        default: false
        type: boolean
      release_module:
        description: Rehearse one module directory; blank rehearses all
        required: false
        default: ''
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch' || !inputs.security_diagnostic
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@f173deb9a9b501c85137a00fa9cccd5287f8cc26 # v2.0.0 patched documentation tooling
    with:
      tooling_sha: f173deb9a9b501c85137a00fa9cccd5287f8cc26
      source_bootstrap: true
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}
      release_module: ${{ inputs.release_module || '' }}

  security-diagnostic:
    name: Native security qualification (development only)
    if: github.event_name == 'workflow_dispatch' && inputs.security_diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOWORK: off
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
    steps:
      - name: Reject release substitution
        env:
          RELEASE_DRY_RUN: ${{ inputs.release_dry_run }}
          RELEASE_MODULE: ${{ inputs.release_module }}
        run: test "${RELEASE_DRY_RUN}" = false && test -z "${RELEASE_MODULE}"
      - name: Initialize task-owned caches
        env:
          TASK_ROOT: ${{ runner.temp }}/golib-security-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" "${TASK_ROOT}/lint"
          printf 'GOCACHE=%s\nGOMODCACHE=%s\nGOTMPDIR=%s\nGOLANGCI_LINT_CACHE=%s\nTMPDIR=%s\n' \
            "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" \
            "${TASK_ROOT}/lint" "${TASK_ROOT}/tmp" >>"${GITHUB_ENV}"
      - name: Check out exact producer with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: producer
          persist-credentials: false
          fetch-depth: 0
      - name: Check out reviewed diagnostic tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: 7744b4df6c4750d43af980ee332607dc2c1827ad
          path: security-tooling
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build development qualification tooling
        working-directory: security-tooling
        run: go build -p 1 -trimpath -buildvcs=false -o "${GOTMPDIR}/golib" ./cmd/golib
      - name: Run native security and bounded checks
        id: native-checks
        working-directory: producer
        run: '"${GOTMPDIR}/golib" check --local'
      - name: Classify root gosec refusal without report contents
        if: failure() && steps.native-checks.outcome == 'failure'
        working-directory: producer
        run: |
          set -euo pipefail
          scanner_status=0
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 \
            -nosec-require-rules -nosec-require-justification \
            -fmt=json -out="${GOTMPDIR}/gosec.json" ./... \
            >"${GOTMPDIR}/gosec.log" 2>&1 || scanner_status=$?
          if [[ -f "${GOTMPDIR}/gosec.json" ]]; then
            jq --arg root "${PWD}/" --argjson status "${scanner_status}" '
              {status: $status,
               issue_count: ((.Issues // []) | length),
               load_error_packages: ((.GolangErrors // {}) | keys | length),
               omitted: ([((.Issues // []) | length) - 32, 0] | max),
               issues: [(.Issues // [])[:32][] |
                 {rule: (.rule_id | select(test("^G[0-9]{3}$"))),
                  file: (.file | select(startswith($root)) | ltrimstr($root) |
                    select(length <= 256 and test("^[A-Za-z0-9_./-]+[.]go$"))),
                  line: (.line | select(test("^[0-9]+(-[0-9]+)?$")))}]}
            ' "${GOTMPDIR}/gosec.json"
          else
            echo 'Standalone scanner did not produce a structured report'
          fi
          exit "${scanner_status}"
      - name: Remove task-owned qualification resources
        if: always()
        env:
          TASK_ROOT: ${{ runner.temp }}/golib-security-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for target in "${TASK_ROOT}" "${GITHUB_WORKSPACE}/producer" "${GITHUB_WORKSPACE}/security-tooling"; do
            if [[ -d "${target}" ]]; then
              find "${target}" -type d -exec chmod u+w {} +
              find "${target}" -depth -delete
            fi
          done

  specification:
    name: Specification governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: f173deb9a9b501c85137a00fa9cccd5287f8cc26 # v2.0.0 patched documentation tooling
          path: .golib-tooling
          persist-credentials: false
      - uses: ./.golib-tooling/.github/actions/setup-golib
        with:
          source_bootstrap: true
          tooling_sha: f173deb9a9b501c85137a00fa9cccd5287f8cc26
      - run: golib specification check --online
      - name: Remove specification source bootstrap resources
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${GOLIB_SOURCE_INSTALL_ROOT:-}" ]]; then
            case "${GOLIB_SOURCE_INSTALL_ROOT}" in
              "${RUNNER_TEMP}/golib-source-install."*) ;;
              *) echo 'unexpected specification bootstrap resource path' >&2; exit 1 ;;
            esac
            if [[ -d "${GOLIB_SOURCE_INSTALL_ROOT}" ]]; then
              chmod -R u+w "${GOLIB_SOURCE_INSTALL_ROOT}"
              find "${GOLIB_SOURCE_INSTALL_ROOT}" -depth -delete
            fi
          fi

  required:
    name: Required
    if: always()
    needs: [ci, specification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow and specification governance
        env:
          CI_RESULT: ${{ needs.ci.result }}
          SPECIFICATION_RESULT: ${{ needs.specification.result }}
        run: test "${CI_RESULT}" = success && test "${SPECIFICATION_RESULT}" = success
