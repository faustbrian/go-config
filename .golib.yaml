schema_version: 1
tool_version: v1.0.4
tool_checksums_sha256: 6c1ee70e3fa7aa333d12420dc78d7740f4de78717d1979eeb8a5f70a2a124ba0
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: adapters/awssecretsmanager
      archive: .verification/mutation/bootstrap/adapters-awssecretsmanager.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
    - module: adapters/awssecretsmanager
      mode: apidiff
      path: adapters/awssecretsmanager/api/baseline.txt
operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzStructuredSources$'
        budget: 2s
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzDotenvInterpolation$'
        budget: 2s
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzEnvironmentMapping$'
        budget: 2s
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzDecodeTagsAndDestinationTypes$'
        budget: 2s
        timeout: 20m
      - type: go-test
        packages: ["./filesystem"]
        fuzz: '^FuzzFilesystemBoundary$'
        budget: 2s
        timeout: 20m
      - type: go-test
        packages: ["./discover"]
        fuzz: '^FuzzDiscoveryBoundary$'
        budget: 2s
        timeout: 20m
  - module: adapters/awssecretsmanager
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzSourceLoad$'
        budget: 2s
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
  - module: adapters/awssecretsmanager
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
