schema_version: 1
tool_version: v1.3.0
tool_checksums_sha256: 72d38d7d0cab33bfeb9345df6b141eacf9841c5d6817f597ff25b957dc8dc48f
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: adapters/awssecretsmanager
      archive: .verification/mutation/bootstrap/adapters-awssecretsmanager.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
    - module: adapters/awssecretsmanager
      mode: apidiff
      path: adapters/awssecretsmanager/api/baseline.txt
operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzStructuredSources$'
        budget: 2s
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzDotenvInterpolation$'
        budget: 2s
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzEnvironmentMapping$'
        budget: 2s
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzDecodeTagsAndDestinationTypes$'
        budget: 2s
        timeout: 20m
      - type: go-test
        packages: ["./filesystem"]
        fuzz: '^FuzzFilesystemBoundary$'
        budget: 2s
        timeout: 20m
      - type: go-test
        packages: ["./discover"]
        fuzz: '^FuzzDiscoveryBoundary$'
        budget: 2s
        timeout: 20m
  - module: adapters/awssecretsmanager
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzSourceLoad$'
        budget: 2s
        timeout: 20m
  - module: .
    gate: conformance
    steps:
      - type: go-test
        packages: [".", "./json", "./yaml", "./toml"]
        count: 1
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
  - module: adapters/awssecretsmanager
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
